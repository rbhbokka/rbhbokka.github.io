<svg xmlns="http://www.w3.org/2000/svg" width="460" height="996" viewBox="0 0 460 996" role="img" aria-hidden="true">
  <rect width="460" height="996" fill="#131317"/>
  <rect width="460" height="996" fill="#101014"/>

  <!-- survey grid -->
  <g stroke="rgba(255,255,255,.04)" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="996"/><line x1="120" y1="0" x2="120" y2="996"/>
    <line x1="180" y1="0" x2="180" y2="996"/><line x1="240" y1="0" x2="240" y2="996"/>
    <line x1="300" y1="0" x2="300" y2="996"/><line x1="360" y1="0" x2="360" y2="996"/>
    <line x1="420" y1="0" x2="420" y2="996"/>
