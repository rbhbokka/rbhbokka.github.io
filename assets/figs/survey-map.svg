    <circle cx="266" cy="170" r="7"/><circle cx="266" cy="229" r="7"/><circle cx="266" cy="347" r="7"/><circle cx="266" cy="406" r="7"/><circle cx="266" cy="524" r="7"/><circle cx="266" cy="583" r="7"/><circle cx="266" cy="642" r="7"/><circle cx="266" cy="760" r="7"/><circle cx="266" cy="819" r="7"/>
    <circle cx="324" cy="229" r="7"/><circle cx="324" cy="288" r="7"/><circle cx="324" cy="347" r="7"/><circle cx="324" cy="465" r="7"/><circle cx="324" cy="583" r="7"/><circle cx="324" cy="642" r="7"/><circle cx="324" cy="819" r="7"/>
    <circle cx="382" cy="170" r="7"/><circle cx="382" cy="288" r="7"/><circle cx="382" cy="406" r="7"/><circle cx="382" cy="524" r="7"/><circle cx="382" cy="642" r="7"/><circle cx="382" cy="701" r="7"/><circle cx="382" cy="760" r="7"/>
