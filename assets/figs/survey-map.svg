  <!-- avatar -->
  <circle cx="410" cy="490" r="20" fill="#1b1b21" stroke="rgba(255,255,255,.09)"/>
  <circle cx="410" cy="484" r="6" fill="#3a3a44"/>
  <path d="M 399 500 Q 410 490 421 500" fill="#3a3a44"/>

