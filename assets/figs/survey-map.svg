    <circle cx="208" cy="229" r="7"/><circle cx="208" cy="406" r="7"/><circle cx="208" cy="642" r="7"/>
    <circle cx="266" cy="288" r="7"/><circle cx="266" cy="465" r="7"/><circle cx="266" cy="701" r="7"/>
