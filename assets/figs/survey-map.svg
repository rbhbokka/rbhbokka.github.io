  <rect x="30" y="20" width="34" height="10" rx="5" fill="#3a3a44"/>
  <rect x="382" y="21" width="14" height="8" rx="2" fill="#3a3a44"/>
  <rect x="402" y="21" width="14" height="8" rx="2" fill="#3a3a44"/>
  <rect x="422" y="20" width="18" height="10" rx="3" fill="#3a3a44"/>
