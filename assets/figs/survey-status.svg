<svg xmlns="http://www.w3.org/2000/svg" width="460" height="996" viewBox="0 0 460 996" role="img" aria-hidden="true">
  <rect width="460" height="996" fill="#131317"/>
  <rect x="0" y="0" width="460" height="560" fill="#101014"/>

  <!-- survey grid (map area only) -->
  <g stroke="rgba(255,255,255,.04)" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="560"/><line x1="120" y1="0" x2="120" y2="560"/>
    <line x1="180" y1="0" x2="180" y2="560"/><line x1="240" y1="0" x2="240" y2="560"/>
    <line x1="300" y1="0" x2="300" y2="560"/><line x1="360" y1="0" x2="360" y2="560"/>
    <line x1="420" y1="0" x2="420" y2="560"/>
    <line x1="0" y1="120" x2="460" y2="120"/><line x1="0" y1="240" x2="460" y2="240"/>
    <line x1="0" y1="360" x2="460" y2="360"/><line x1="0" y1="480" x2="460" y2="480"/>
  </g>
  <ellipse cx="330" cy="380" rx="150" ry="110" fill="rgba(255,255,255,.02)"/>
  <ellipse cx="120" cy="470" rx="110" ry="80" fill="rgba(255,255,255,.02)"/>

  <!-- site boundary: segmented array row along left edge, sliding under the sheet -->
  <path d="M 96 140 L 96 560" fill="none" stroke="rgba(255,180,84,.55)" stroke-width="8" stroke-dasharray="3 7"/>
  <path d="M 110 150 L 110 560" fill="none" stroke="rgba(255,180,84,.25)" stroke-width="1.5"/>

  <!-- survey marker columns: connector line + mixed installed (filled) / surveyed (outline) -->
  <g stroke="rgba(255,180,84,.25)" stroke-width="6">
    <line x1="150" y1="170" x2="150" y2="560"/><line x1="208" y1="170" x2="208" y2="560"/>
    <line x1="266" y1="170" x2="266" y2="560"/><line x1="324" y1="170" x2="324" y2="560"/>
    <line x1="382" y1="170" x2="382" y2="560"/>
  </g>
  <g fill="#ffb454">
    <circle cx="150" cy="228" r="7"/><circle cx="150" cy="286" r="7"/><circle cx="150" cy="402" r="7"/><circle cx="150" cy="460" r="7"/><circle cx="150" cy="518" r="7"/>
    <circle cx="208" cy="170" r="7"/><circle cx="208" cy="286" r="7"/><circle cx="208" cy="344" r="7"/><circle cx="208" cy="460" r="7"/>
    <circle cx="266" cy="170" r="7"/><circle cx="266" cy="228" r="7"/><circle cx="266" cy="344" r="7"/><circle cx="266" cy="402" r="7"/><circle cx="266" cy="518" r="7"/>
    <circle cx="324" cy="228" r="7"/><circle cx="324" cy="286" r="7"/><circle cx="324" cy="344" r="7"/><circle cx="324" cy="460" r="7"/><circle cx="324" cy="518" r="7"/>
    <circle cx="382" cy="170" r="7"/><circle cx="382" cy="286" r="7"/><circle cx="382" cy="402" r="7"/><circle cx="382" cy="518" r="7"/>
  </g>
  <g fill="#101014" stroke="#ffb454" stroke-width="1.5">
    <circle cx="150" cy="170" r="7"/><circle cx="150" cy="344" r="7"/>
    <circle cx="208" cy="228" r="7"/><circle cx="208" cy="402" r="7"/><circle cx="208" cy="518" r="7"/>
    <circle cx="266" cy="286" r="7"/><circle cx="266" cy="460" r="7"/>
    <circle cx="324" cy="170" r="7"/><circle cx="324" cy="402" r="7"/>
    <circle cx="382" cy="228" r="7"/><circle cx="382" cy="344" r="7"/><circle cx="382" cy="460" r="7"/>
  </g>

  <!-- compass -->
  <circle cx="52" cy="150" r="15" fill="#131317" stroke="#3a3a44" stroke-width="1.5"/>
  <polygon points="52,139 47,150 57,150" fill="#ffb454"/>
  <polygon points="52,161 47,150 57,150" fill="#3a3a44"/>

  <!-- scale bar -->
  <rect x="200" y="70" width="60" height="8" rx="4" fill="#26262d"/>
  <g stroke="#3a3a44" stroke-width="1.5">
    <line x1="170" y1="90" x2="290" y2="90"/>
    <line x1="170" y1="84" x2="170" y2="96"/>
    <line x1="230" y1="86" x2="230" y2="94"/>
    <line x1="290" y1="84" x2="290" y2="96"/>
  </g>

  <!-- control rail -->
  <g>
    <rect x="388" y="200" width="44" height="44" rx="10" fill="#1b1b21" stroke="rgba(255,255,255,.09)"/>
    <path d="M 400 220 L 407 214 L 413 220 L 420 214" fill="none" stroke="#3a3a44" stroke-width="1.5"/>
    <path d="M 400 228 L 407 222 L 413 228 L 420 222" fill="none" stroke="#3a3a44" stroke-width="1.5"/>
    <rect x="388" y="252" width="44" height="44" rx="10" fill="#1b1b21" stroke="rgba(255,255,255,.09)"/>
    <circle cx="410" cy="274" r="9" fill="none" stroke="#3a3a44" stroke-width="1.5"/>
    <circle cx="410" cy="274" r="2.5" fill="#3a3a44"/>
    <rect x="388" y="304" width="44" height="44" rx="10" fill="#1b1b21" stroke="rgba(255,255,255,.09)"/>
    <polygon points="410,317 418,335 410,330 402,335" fill="none" stroke="#3a3a44" stroke-width="1.5"/>
    <rect x="388" y="356" width="44" height="44" rx="10" fill="#1b1b21" stroke="rgba(255,255,255,.09)"/>
    <path d="M 403 390 L 403 368 L 418 372 L 403 376" fill="none" stroke="#ffb454" stroke-width="1.5"/>
  </g>

  <!-- avatar -->
  <circle cx="410" cy="442" r="20" fill="#1b1b21" stroke="rgba(255,255,255,.09)"/>
  <circle cx="410" cy="436" r="6" fill="#3a3a44"/>
  <path d="M 399 452 Q 410 442 421 452" fill="#3a3a44"/>

  <!-- scrim over map while the sheet is up -->
  <rect x="0" y="0" width="460" height="560" fill="rgba(0,0,0,.35)"/>

  <!-- status bar -->
  <rect x="30" y="20" width="34" height="10" rx="5" fill="#3a3a44"/>
  <rect x="382" y="21" width="14" height="8" rx="2" fill="#3a3a44"/>
  <rect x="402" y="21" width="14" height="8" rx="2" fill="#3a3a44"/>
  <rect x="422" y="20" width="18" height="10" rx="3" fill="#3a3a44"/>

  <!-- bottom sheet -->
  <rect x="0" y="520" width="460" height="500" rx="18" fill="#1b1b21" stroke="rgba(255,255,255,.09)"/>
  <rect x="210" y="532" width="40" height="5" rx="2.5" fill="#3a3a44"/>
  <rect x="160" y="556" width="140" height="8" rx="4" fill="#26262d"/>

  <!-- item row: icon tile + title/subtitle bars -->
  <rect x="30" y="590" width="56" height="56" rx="12" fill="#131317" stroke="rgba(255,255,255,.09)"/>
  <rect x="54" y="602" width="8" height="32" rx="4" fill="#ffb454"/>
  <rect x="106" y="602" width="184" height="10" rx="5" fill="#3a3a44"/>
  <rect x="106" y="622" width="146" height="8" rx="4" fill="#26262d"/>

  <!-- option rows -->
  <rect x="30" y="676" width="400" height="54" rx="12" fill="rgba(255,180,84,.12)" stroke="#ffb454" stroke-width="1.5"/>
  <text x="54" y="707" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1" fill="#ffb454">SURVEYED</text>
  <rect x="30" y="744" width="400" height="54" rx="12" fill="#1e1e26" stroke="rgba(255,255,255,.09)"/>
  <text x="54" y="775" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1" fill="#9a9aa3">INSTALLED</text>
</svg>
