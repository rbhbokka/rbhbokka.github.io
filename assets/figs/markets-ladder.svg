  <text x="48" y="760" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#ffb454">2</text>

  <!-- bottom tab bar, active slot 3 -->
  <line x1="0" y1="912" x2="460" y2="912" stroke="rgba(255,255,255,.09)"/>
  <g fill="none" stroke="#3a3a44" stroke-width="1.5">
