  <!-- bid depth: filled bars growing leftward, widening downward -->
  <g fill="rgba(255,180,84,.55)">
    <rect x="152" y="617" width="26" height="24" rx="4"/>
    <rect x="128" y="659" width="50" height="24" rx="4"/>
    <rect x="120" y="701" width="58" height="24" rx="4"/>
    <rect x="106" y="743" width="72" height="24" rx="4"/>
    <rect x="110" y="785" width="68" height="24" rx="4"/>
    <rect x="94" y="827" width="84" height="24" rx="4"/>
