    <rect x="129" y="932" width="18" height="18" rx="5"/>
    <rect x="313" y="932" width="18" height="18" rx="5"/>
    <rect x="405" y="932" width="18" height="18" rx="5"/>
  </g>
  <rect x="221" y="932" width="18" height="18" rx="5" fill="none" stroke="#ffb454" stroke-width="1.5"/>
  <g fill="#26262d">
    <rect x="28" y="962" width="36" height="6" rx="3"/>
    <rect x="120" y="962" width="36" height="6" rx="3"/>
    <rect x="304" y="962" width="36" height="6" rx="3"/>
    <rect x="396" y="962" width="36" height="6" rx="3"/>
  </g>
  <rect x="212" y="962" width="36" height="6" rx="3" fill="#ffb454"/>
