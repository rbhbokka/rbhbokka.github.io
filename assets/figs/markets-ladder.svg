    <rect x="202" y="414" width="56" height="10" rx="5"/>
    <rect x="202" y="456" width="56" height="10" rx="5"/>
    <rect x="202" y="498" width="56" height="10" rx="5"/>
    <rect x="202" y="540" width="56" height="10" rx="5"/>
    <rect x="202" y="624" width="56" height="10" rx="5"/>
    <rect x="202" y="666" width="56" height="10" rx="5"/>
    <rect x="202" y="708" width="56" height="10" rx="5"/>
    <rect x="202" y="750" width="56" height="10" rx="5"/>
    <rect x="202" y="792" width="56" height="10" rx="5"/>
    <rect x="202" y="834" width="56" height="10" rx="5"/>
    <rect x="202" y="876" width="56" height="10" rx="5"/>
