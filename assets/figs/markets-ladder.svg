    <line x1="0" y1="566" x2="460" y2="566"/><line x1="0" y1="608" x2="460" y2="608"/>
    <line x1="0" y1="650" x2="460" y2="650"/><line x1="0" y1="692" x2="460" y2="692"/>
    <line x1="0" y1="734" x2="460" y2="734"/><line x1="0" y1="776" x2="460" y2="776"/>
    <line x1="0" y1="818" x2="460" y2="818"/><line x1="0" y1="860" x2="460" y2="860"/>
